name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev extras + quantrisk-core for the strategy port)
        run: |
          pip install -e ".[dev]"
          pip install "git+https://github.com/MengdanXue/quantrisk-core.git"
      - name: pytest (no API keys, no database, no network)
        run: pytest -q -rs
      - name: S2c suite, complete (recorded model answers; a missing strategy provider fails the job)
        env:
          AGENTRT_REQUIRE_STRATEGIES: "1"
        run: pytest -q -rs validation/real_llm/test_s2c.py
  pytest-core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without the strategy provider
        run: pip install -e ".[dev]"
      - name: pytest (strategy-dependent tests must skip, not fail)
        run: pytest -q -rs
      - name: S2c suite without quantrisk-core (workflow tests skip with the reason; the rest must pass)
        run: pytest -q -rs validation/real_llm/test_s2c.py
