[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-kit"
version = "0.1.0"
description = "Auditable LLM agent runtime: plan with deterministic validation, run tools, record every step, require human approval before (paper) execution"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mengdan Xue" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "anthropic>=1.8,<2", "httpx>=0.26", "pyyaml>=6"]

[project.optional-dependencies]
openai = ["openai>=1"]
gemini = ["google-generativeai>=0.5"]
quant = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]
quantrisk = ["quantrisk-core @ git+https://github.com/MengdanXue/quantrisk-core.git"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
sql = ["sqlalchemy>=2.0"]
skills = ["watchdog>=3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "fastapi>=0.110", "httpx>=0.26", "watchdog>=3", "sqlalchemy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
